<svg xmlns='http://www.w3.org/2000/svg' viewBox='52 -3 176 176' role='img' aria-labelledby='icon-title'>
<title id='icon-title'>The Earl of Bubblehum's hat.</title>
<!--
  The Earl's hat and nothing else: the brim, the leaning cone and the band, at exactly the
  coordinates they have in the drawing on the page, cropped to them by the viewBox so the
  two cannot drift. The star he wears on it and the face under it are dropped — a 16-pixel
  tab carries one shape, and this is the one. No ground behind it: on a tab it takes the
  browser's own, and iOS lays a transparent home-screen icon over black, which a pink hat
  is happy on.
-->
